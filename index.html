}

a{color:var(--accent)}

  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px}

function profText(){const p=P();return L1('Name',p.name)+L1('Base',p.base)+L1('Level',p.level)+L1('Pay range',(p.salaryMin||p.salaryMax)?`${p.salaryMin||'?'} to ${p.salaryMax||'?'} ${p.currency||''}`:'')+L1('Work modes',(p.workModes||[]).join(', '))+L1('Industries',p.industries)+L1('Roles wanted',p.targets)+L1('Skills',(p.skills||[]).join(', '))+L1('Interests',(p.interests||[]).join(', '))+L1('Always skip',p.avoid)+L1('Never claim',p.truth)+L1('Background',p.background)+(p.cvText?'CV (plain text):\n'+p.cvText+'\n':'')+L1('LinkedIn link',p.linkedin)+(p.linkedinText?'LinkedIn profile text:\n'+p.linkedinText+'\n':'')}
function idealText(){const i=S.extras.ideal||{};return ['title','level','where','pay','industries','musts','nice','dealbreakers'].map(k=>i[k]?k+': '+String(i[k]).replace(/\n/g,'; ')+'\n':'').join('')}
const roleText=r=>['title','company','location','pay','posted','deadline','url','why','gap','caveats','technical'].map(k=>r[k]?k+': '+r[k]+'\n':'').join('');
function scorePrompt(r){return 'You are the Matcher, an honest job-fit scorer who works like a tailor. Score this role for the person. Use only what the profile says; never invent experience. Reply with JSON only: {"match":0-100,"chance":0-100,"fits":["..."],"unfits":["..."],"factors":[{"label":"...","note":"..."}],"advice":"2-3 sentences","caveats":"..."}. match = fit of the real requirements against the profile, measured against the ideal 100% role. chance = real chance of getting it, never above match+5, adjusted for work status, language, local experience, culture, referral access and years required. Be honest.\n\nPROFILE\n'+profText()+'\nIDEAL 100% ROLE\n'+idealText()+'\nROLE\n'+roleText(r)}
const noAuto=()=>{flash('Automatic scoring is not available here. Open the Matcher and use Copy scoring prompt.');return false};
async function scoreHere(id){const r=S.roles[id];if(!r)return false;
  try{const smp=await claude.use('sample');if(!smp||!smp.json)return noAuto();
   flash('The Matcher is scoring this role...');
   const o=await smp.json(scorePrompt(r));const n=v=>Math.max(0,Math.min(100,Math.round(+v||0)));const m=n(o.match),ch=Math.min(n(o.chance),m+5);
   await upd('roles',id,{match:m,chance:ch,tier:ch>=70?'Strong':ch>=55?'Stretch':'Long shot',fits:(o.fits||[]).slice(0,4).map(String),unfits:(o.unfits||[]).slice(0,4).map(String),advice:String(o.advice||''),caveats:String(o.caveats||r.caveats||''),factors:(o.factors||[]).slice(0,6).map(f=>({label:String(f.label||''),note:String(f.note||'')})),scoredAt:today()});
   flash('Scored.');return true}catch(e){return noAuto()}}
let MT=0;
function fireMatcher(){clearTimeout(MT);MT=setTimeout(async()=>{const a=agent('matcher');
  try{const mcp=await claude.use('mcp');if(mcp&&a.triggerId&&!window.__jd){await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:a.triggerId});flash('The Matcher is scoring. It takes a few minutes and the scores appear here on their own.');return}}catch(e){}
  for(const [id,r] of Object.entries(S.roles)){if(stageOf(r)==='matched'&&r.chance==null)await scoreHere(id)}},5000)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){return false}}
async function saveFile(name,text){
  if(!window.__jd){try{const dl=await claude.use('downloads');if(dl){for(const n of [name,name.replace(/\.doc$/,'.html')]){try{await dl.save({filename:n,data:text});return true}catch(e){}}}}catch(e){}}
  try{const b=new Blob([text],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}}

/* question of the day */
function qotd(){
  if(emptyProfile())return '';
  const un=Object.entries(S.questions).filter(([id,q])=>!answered(q)).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  let st=null;try{st=JSON.parse(localStorage.getItem('jd-qd')||'null')}catch(e){}
  const t=today();
  if(!st||st.day!==t||!S.questions[st.id]){
    if(!un.length)return '';
    const pick=un[Math.floor(Date.now()/864e5)%un.length][0];st={day:t,id:pick};try{localStorage.setItem('jd-qd',JSON.stringify(st))}catch(e){}}
  const q=S.questions[st.id];if(!q)return '';
  const sel=Array.isArray(q.answer)?q.answer:(q.answer?[q.answer]:[]);
  return `<section class="box qd"><div class="rsrow"><h2>Question of the day</h2><span class="small muted">${sel.length?'Thanks. Another one tomorrow.':'One tap, and every helper learns about you.'}</span></div><p><b>${esc(q.text)}</b>${q.multi?' <span class="small muted">(pick any)</span>':''}</p><div class="opts">${(q.options||[]).map((o,i)=>`<button class="opt" data-qa="${st.id}" data-oi="${i}" aria-pressed="${sel.includes(o)}" ${canWrite?'':'disabled'}>${esc(o)}</button>`).join('')}</div></section>`}
const emptyProfile=()=>{const p=P();return !p.name&&!(p.industryList||[]).length&&!p.targets&&!p.background&&!p.cv&&!p.cvText};

async function superReview(){const say=x=>{const e=$('srsv');if(e)e.textContent=T(x)};say('Reviewing...');
  let smp=null;try{smp=await claude.use('sample')}catch(e){}if(!smp||!smp.json){say('Not available here.');return}
  const rs=Object.values(S.roles).slice(0,40).map(r=>[r.title,r.company,stageOf(r),r.tier||'',r.chance==null?'':r.chance,r.outcome||'',r.feedback||'',r.reason||'',(r.unfits||[]).slice(0,2).join('; ')].join(' | ')).join('\n')||'(no roles yet)';
  const pr='You are the Supervisor of a job search team (Scout finds roles, Matcher scores them, Coach tailors applications). Review this person\u2019s search honestly and practically. Use only the data below. Reply with JSON only: {"report":"2 to 3 sentences on where the search stands and where to focus","changes":["3 short proposals to change how the team works for this person"],"growth":[{"kind":"skill","title":"a skill or credential worth building","why":"one sentence tied to the profile or the roles"},{"kind":"focus","title":"where to spend effort","why":"one sentence"}]} with 3 to 5 growth items.\n\nPROFILE\n'+profText()+'\nCV\n'+String(P().cvText||'').slice(0,4000)+'\nROLES (title | company | stage | tier | chance | outcome | feedback | reason | gaps)\n'+rs;
  try{const o=await smp.json(pr);if(!o||!o.report)throw 0;
   const ag=(RAW.agents&&RAW.agents.super)||{};const by={...(ag.byProfile||{}),[actKey()]:{report:String(o.report),changes:(o.changes||[]).slice(0,5).map(String),growth:(o.growth||[]).slice(0,6).map(g=>({kind:g.kind==='focus'?'focus':'skill',title:String(g.title||''),why:String(g.why||'')}))}};
   await put('agents','super',{byProfile:by});say('Done.')}catch(e){say('Could not review right now. Try again.')}}
async function genIdeal(){const say=x=>{const e=$('idsv');if(e)e.textContent=T(x)};say('Writing...');
  let o=null;
  try{const smp=await claude.use('sample');if(smp&&smp.json)o=await smp.json('Write one example of a job that would be a 100% match for this person: realistic and specific, based only on the profile. Reply with JSON only: {"title":"","level":"","where":"","pay":"","industries":"","musts":"3 to 5 lines separated by newlines","nice":"2 to 3 lines separated by newlines","dealbreakers":"2 to 3 lines separated by newlines"}.\n\nPROFILE\n'+profText())}catch(e){}
  if(!o){const p=P();o={title:(p.targets||'').split(/\n|;|,/)[0].trim(),level:p.level||'',where:[(p.workModes||[]).join(' or '),p.base].filter(Boolean).join(', '),pay:(p.salaryMin||p.salaryMax)?`${p.salaryMin||''}${p.salaryMax?' to '+p.salaryMax:''} ${p.currency||''}`.trim():'',industries:p.industries||'',musts:(p.skills||[]).slice(0,4).join('\n'),nice:(p.interests||[]).slice(0,3).join('\n'),dealbreakers:p.avoid||''}}
  const d={};IDF.forEach(([k])=>{d[k]=typeof o[k]==='string'?o[k]:Array.isArray(o[k])?o[k].join('\n'):''});d.edited=false;d.generatedAt=today();

/* Matcher: compare two roles */
let CMP={a:'',b:'',v:''};
function compareCard(){
  const L=roles().filter(live).filter(r=>['matched','preparing','applied','followup'].includes(stageOf(r))||r.chance!=null).sort(byRank);
  const opt=sel=>`<option value="">Choose a role</option>`+L.map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${esc(r.title)} · ${esc(r.company)}</option>`).join('');
  const A=S.roles[CMP.a],B=S.roles[CMP.b];let out='';
  if(L.length<2)out='<p class="empty">You need at least two roles with the Matcher to compare them.</p>';
  else if(A&&B&&CMP.a!==CMP.b)out=cmpTable({id:CMP.a,...A},{id:CMP.b,...B});
  return `<section class="box"><h2>Compare two roles</h2><p class="small muted">Pick two roles and the Matcher puts them side by side and says which to go for first.</p><div class="fgrid"><label class="f" for="cm-a">Role A<select id="cm-a" data-cmp="a">${opt(CMP.a)}</select></label><label class="f" for="cm-b">Role B<select id="cm-b" data-cmp="b">${opt(CMP.b)}</select></label></div>${out}</section>`}
function cmpTable(a,b){
  const f=(r,k)=>r[k]==null||r[k]===''?'—':esc(Array.isArray(r[k])?r[k].join(' · '):r[k]);
  const num=(r,k)=>r[k]==null?'—':r[k]+'%';
  const win=k=>a[k]!=null&&b[k]!=null&&a[k]!==b[k]?(a[k]>b[k]?'a':'b'):'';
  const row=(l,fa,fb,w)=>`<tr><th scope="row">${l}</th><td class="${w==='a'?'win':''}">${fa}</td><td class="${w==='b'?'win':''}">${fb}</td></tr>`;
  const rows=[row('Real chance',num(a,'chance'),num(b,'chance'),win('chance')),row('Fit',num(a,'match'),num(b,'match'),win('match')),row('Tier',esc(tier(a)||'—'),esc(tier(b)||'—'),''),row('Where',f(a,'location'),f(b,'location'),''),row('Pay',f(a,'pay'),f(b,'pay'),''),row('Where you fit',f(a,'fits'),f(b,'fits'),''),row("Where you don't",f(a,'unfits'),f(b,'unfits'),''),row('Deadline',f(a,'deadline'),f(b,'deadline'),'')].join('');
  const sa=a.chance??a.match,sb=b.chance??b.match;
  const quick=(sa==null||sb==null)?'<p class="small muted">Score both roles first to get a call.</p>':sa===sb?'<p class="small"><b>Quick call:</b> They score the same. Choose by pay, place or deadline.</p>':`<p class="small"><b>Quick call:</b> ${esc(sa>sb?a.title:b.title)}, ${esc(sa>sb?a.company:b.company)}, has the better real chance (${Math.max(sa,sb)}% against ${Math.min(sa,sb)}%).</p>`;
  return `<div class="cmpw"><table class="cmp"><thead><tr><th></th><th>${esc(a.title)}<span class="small muted"><br>${esc(a.company)}</span></th><th>${esc(b.title)}<span class="small muted"><br>${esc(b.company)}</span></th></tr></thead><tbody>${rows}</tbody></table></div>${quick}<div class="row"><button class="btn sm" data-cmpask="1">Ask the Matcher which to go for first</button><span class="saved" id="cmpsv" role="status"></span></div>${CMP.v?`<p class="small cmpv">${esc(CMP.v)}</p>`:''}`}
async function cmpAsk(){const a=S.roles[CMP.a],b=S.roles[CMP.b];const say=x=>{const e=$('cmpsv');if(e)e.textContent=T(x)};if(!a||!b)return;
  const pr='You are the Matcher. Compare these two roles for this person and say which one to go for first, and why, in 3 to 4 plain sentences. Be honest about the real chance, fit, pay and risk. Use only the data given.\n\nPROFILE\n'+profText()+'\nIDEAL 100% ROLE\n'+idealText()+'\nROLE A\n'+roleText(a)+'fit: '+a.match+' chance: '+a.chance+'\nROLE B\n'+roleText(b)+'fit: '+b.match+' chance: '+b.chance+'\n';
  try{const smp=await claude.use('sample');if(!smp){const ok=await copyText(pr);say(ok?'Prompt copied. Paste it into Claude.':'Not available here.');return}
   say('Thinking...');const r=await smp(pr);CMP.v=(r&&r.text)||'';say('');render()}catch(e){say('Could not do it now. Try again.')}}

/* Supervisor: applications folder */
const OUT=[['waiting','Waiting'],['replied','They replied'],['interview','Interview'],['offer','Offer'],['rejected','Rejected'],['noreply','No reply']];
const OUTL=Object.fromEntries(OUT);
const folder=()=>roles().filter(r=>['applied','followup'].includes(stageOf(r))).sort((a,b)=>(b.appliedAt||'').localeCompare(a.appliedAt||''));
const sinceApplied=r=>dAgo(r.appliedAt||r.movedAt||r.added);
const dueFu=r=>(r.outcome||'waiting')==='waiting'&&sinceApplied(r)>=7;
function fuNote(r){const n=r.appliedAt?r.appliedAt:'';return LANG==='es'?`Hola, postulé al cargo de ${r.title} en ${r.company}${n?' el '+n:''} y quería saber cómo va el proceso. Sigo muy interesado/a y con gusto envío lo que haga falta. Gracias por su tiempo.`:`Hi, I applied for the ${r.title} role at ${r.company}${n?' on '+n:''} and wanted to check in on the process. I am still very interested and happy to share anything that helps. Thank you for your time.`}
function appCard(r){const o=r.outcome||'waiting';
  return `<div class="app"><div class="rsrow"><button class="main" data-id="${r.id}"><span class="t">${esc(r.title)}</span><br><span class="muted small">${esc(r.company)}${r.appliedAt?' · applied '+esc(ago(r.appliedAt)):''}</span></button><span class="pill ${o==='offer'||o==='interview'?'strong':o==='rejected'||o==='noreply'?'long':''}">${OUTL[o]||o}</span></div>
  ${dueFu(r)?`<p class="small fudue">No news for ${sinceApplied(r)} days. Time to follow up. <button class="btn sm alt" data-fucopy="${r.id}">Copy a follow-up note</button></p>`:''}
  <div class="opts">${OUT.map(([k,l])=>`<button class="opt" data-out="${k}" data-rid="${r.id}" aria-pressed="${o===k}" ${canWrite?'':'disabled'}>${l}</button>`).join('')}</div>
  <label class="f small" for="on-${r.id}">What happened?<textarea id="on-${r.id}" rows="2" data-outnote="${r.id}" placeholder="e.g. They asked for a call on Tuesday" ${canWrite?'':'disabled'}>${esc(r.outcomeNote||'')}</textarea></label>
  ${(r.history||[]).length?`<ul class="tight small muted">${r.history.slice().reverse().map(h=>`<li>${esc(h.date)}: ${esc(OUTL[h.outcome]||h.outcome)}${h.note?' · '+esc(h.note):''}</li>`).join('')}</ul>`:''}</div>`}
function appStats(){const F=folder(),n=F.length;
  if(n<2)return '<p class="small muted">Log what happens after you apply. With a few results I can tell you what is working.</p>';
  const ans=F.filter(r=>['replied','interview','offer','rejected'].includes(r.outcome)).length,iv=F.filter(r=>['interview','offer'].includes(r.outcome)).length,of=F.filter(r=>r.outcome==='offer').length;
  const tiers=['Strong','Stretch','Long shot'].map(t=>{const g=F.filter(r=>tier(r)===t);return g.length?`<tr><td>${t}</td><td>${g.length}</td><td>${g.filter(r=>['replied','interview','offer'].includes(r.outcome)).length}</td></tr>`:''}).join('');
  return `<div class="hstats4"><div><b>${n}</b><span>Applied</span></div><div><b>${Math.round(ans/n*100)}%</b><span>Got an answer</span></div><div><b>${iv}</b><span>Interviews</span></div><div><b>${of}</b><span>Offers</span></div></div>${tiers?`<table class="cmp mini"><thead><tr><th>Tier when you applied</th><th>Applied</th><th>Moved forward</th></tr></thead><tbody>${tiers}</tbody></table>`:''}`}
function appsSection(){const F=folder();
  return `<section class="box"><h2>Your applications</h2><p class="small muted">Every role you applied to lives here. Come back when they answer and tell me what happened: it feeds the follow-ups and the advice.</p>
  ${F.length?F.map(appCard).join(''):'<p class="empty">No applications yet. Mark a role as applied and it shows up here.</p>'}
  <details><summary>Add an application you made elsewhere</summary><div class="fgrid" style="margin-top:10px"><label class="f" for="ap-t">Job title<input type="text" id="ap-t"></label><label class="f" for="ap-c">Company<input type="text" id="ap-c"></label><label class="f" for="ap-u">Link to the posting<input type="text" id="ap-u"></label><label class="f" for="ap-d">Date applied (YYYY-MM-DD)<input type="text" id="ap-d" placeholder="${today()}"></label></div><div class="row" style="margin-top:10px"><button class="btn" data-addapp="1">Add to my applications</button><span class="saved" id="apsv"></span></div></details></section>
  <section class="box"><h2>What your applications tell us</h2>${appStats()}</section>`}

/* Coach: plan, tailored CV, general tips */
function coachPrompt(kind,r){const base='You are the Coach, an experienced career coach. Use ONLY facts that appear in the CV and profile below. Never invent experience, numbers or employers.\n\nPROFILE\n'+profText()+'\nROLE\n'+roleText(r)+(r.advice?'matcher advice: '+r.advice+'\n':'');
  if(kind==='suggest')return base+'\nTask: list 4 to 8 concrete changes to tailor the CV to this role (reorder, reword, add keywords the person truly has, cut). Reply with JSON only: {"changes":[{"text":"the change, one sentence","why":"why it helps for this posting, one sentence"}]}';
  const ok=(r.plan&&r.plan.changes||[]).filter(c=>c.ok).map((c,i)=>(i+1)+'. '+c.text).join('\n');
  return base+'\nTask: rewrite the CV applying ONLY these approved changes and keeping everything else as it is:\n'+ok+'\nReturn the complete CV as plain text, ready to paste into a document. No commentary.'}

async function coachAct(kind,id){const r=S.roles[id];const say=(x,tgt)=>{const e=$((tgt||'cc-')+(id||''));if(e)e.textContent=T(x)};

async function cvToText(f){const n=f.name.toLowerCase();
  if(/\.(txt|md)$/.test(n))return await f.text();
  if(/\.rtf$/.test(n)){const t=await f.text();return t.replace(/\\par[d]?/g,'\n').replace(/\\'[0-9a-f]{2}/gi,'').replace(/\\[a-z]+-?\d* ?/gi,'').replace(/[{}]/g,'')}
  if(/\.docx$/.test(n)){if(!window.JSZip)await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const z=await JSZip.loadAsync(await f.arrayBuffer());const x=await z.file('word/document.xml').async('string');
    return x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<w:br\/>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")}
  if(/\.pdf$/.test(n)){const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';if(!window.pdfjsLib)await loadJS(B+'pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';
    const d=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let out='';
    for(let i=1;i<=Math.min(d.numPages,6);i++){const pg=await d.getPage(i);const c=await pg.getTextContent();let y=null;for(const it of c.items){if(y!==null&&Math.abs(it.transform[5]-y)>2)out+='\n';else if(y!==null)out+=' ';out+=it.str;y=it.transform[5]}out+='\n\n'}
    return out}
  return ''}

  if(el.id==='li-file'&&el.files[0]){(async()=>{const f=el.files[0],m=$('lisv');if(m)m.textContent=T('Reading your CV...');try{let t=(await cvToText(f)||'').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();if(t.length<80){if(m)m.textContent=T('I could not read text from that file. Paste the text below.');return}await upd('profile','main',{linkedinText:t.slice(0,20000)});const ta=$('pf-linkedinText');if(ta)ta.value=t.slice(0,20000);if(m)m.textContent='';flash('LinkedIn text read. Check it below.')}catch(e){if(m)m.textContent=T('I could not read text from that file. Paste the text below.')}})();return}
  if(el.id==='cv-file'&&el.files[0]){uploadCV(el.files[0]).then(()=>extractCV(el.files[0]));return}if(!el.dataset)return;
  if(el.dataset.lv){const lo=+$('lv-min').value,hi=+$('lv-max').value;await upd('profile','main',{levelMin:lo,levelMax:hi,level:LV[lo]===LV[hi]?LV[lo]:LV[lo]+' to '+LV[hi]})}
  if(el.dataset.sal){const v=el.dataset.sal==='currency'?el.value:(el.value.replace(/[^0-9]/g,'')||'');await upd('profile','main',{[el.dataset.sal]:v})}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.tgin){e.preventDefault();const b=document.querySelector('[data-tadd="'+e.target.dataset.tgin+'"]');if(b)b.click();return}if(e.key==='Escape'&&openId){openId=null;render()}});
document.addEventListener('focusout',async e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.qother){await upd('questions',el.dataset.qother,{other:el.value})}
  else if(el.dataset.p){await upd('profile','main',{[el.dataset.p]:el.value});const s=$('pfsv');if(s)s.textContent='Saved'}
  else if(el.dataset.coach&&openId){await upd('roles',openId,{coach:{[el.dataset.coach]:el.value}});const s=$('cosv');if(s)s.textContent='Saved'}
  else if(el.dataset.advice&&openId){await upd('roles',openId,{advice:el.value})}
  else if(el.id==='reason'&&openId){await upd('roles',openId,{reason:el.value})}
});

/* ---- v2 handlers ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-pall]');if(!t)return;const d=t.dataset||{};
  if(d.score){scoreHere(d.score);return}
  if(d.scoreprompt){const r=S.roles[d.scoreprompt];if(r)copyText(scorePrompt(r)).then(ok=>flash(ok?'Prompt copied. Paste it into Claude and add the scores by hand in the role.':'Not available here.'));return}
  if(d.superrev){superReview();return}
  if(d.hide){toggleHide(d.hide);return}
  if(d.ideal==='gen'){genIdeal();return}
  if(d.cmpask){cmpAsk();return}
  if(d.cact){coachAct(d.cact,d.rid);return}
  if(d.out){const r=S.roles[d.rid];if(!r)return;const h=(r.history||[]).concat({date:today(),outcome:d.out,note:r.outcomeNote||''});upd('roles',d.rid,{outcome:d.out,outcomeAt:today(),history:h});if(d.out!=='waiting')flash('Noted. I use it to follow up and to learn what works.');return}
  if(d.fucopy){const r=S.roles[d.fucopy];if(r)copyText(fuNote(r)).then(ok=>flash(ok?'Follow-up note copied.':'Not available here.'));return}
  if(d.addapp){const g=i=>($(i)||{value:''}).value.trim();const ti=g('ap-t'),co=g('ap-c');const m=$('apsv');if(!ti||!co||!db){if(m)m.textContent=T('Add a title and a company');return}
    const dt=/^\d{4}-\d{2}-\d{2}$/.test(g('ap-d'))?g('ap-d'):today();
    db.collection('roles').add({profileId:P().activeProfile||'',title:ti,company:co,location:'',url:g('ap-u'),stage:'applied',status:'OPEN',track:'home',source:'added by you',added:dt,movedAt:dt,appliedAt:dt,outcome:'waiting',feedback:'liked'}).then(()=>{['ap-t','ap-c','ap-u','ap-d'].forEach(i=>{if($(i))$(i).value=''});if(m)m.textContent=T('Added')});return}
  if(d.pgo!==undefined){const v=d.pgo;pStep=v==='prev'?Math.max(0,pStep-1):v==='next'?Math.min(5,pStep+1):+v;try{localStorage.setItem('jd-pstep',String(pStep))}catch(x){}pAll=false;render();window.scrollTo(0,0);return}
  if(d.pall!==undefined){pAll=!pAll;render();return}
});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset)return;
  if(el.dataset.cmp){CMP[el.dataset.cmp]=el.value;CMP.v='';render();return}
  if(el.dataset.chg!==undefined){const r=S.roles[el.dataset.rid];if(!r)return;const pl=r.plan||{},ch=(pl.changes||[]).map((c,i)=>i===+el.dataset.chg?{...c,ok:el.checked}:c);upd('roles',el.dataset.rid,{plan:{...pl,changes:ch}})}
});
document.addEventListener('focusout',async e=>{const el=e.target;if(!el.dataset)return;
  if(el.dataset.idealf){await put('extras','ideal',{[el.dataset.idealf]:el.value,edited:true});const s=$('idsv');if(s)s.textContent=T('Saved')}
  else if(el.dataset.outnote){await upd('roles',el.dataset.outnote,{outcomeNote:el.value})}
  else if(el.dataset.plancv){const r=S.roles[el.dataset.plancv];if(r)await upd('roles',el.dataset.plancv,{plan:{...(r.plan||{}),cv:el.value}})}
});

const RAW={};
const ownerOf=x=>x&&x.profileId||'';
const actKey=()=>(RAW.profile&&RAW.profile.main&&RAW.profile.main.activeProfile)||'_';
const ADV=['growth','changes','report','patternFits','patternUnfits'];
function scope(){const a=(RAW.profile&&RAW.profile.main&&RAW.profile.main.activeProfile)||'',ak=a||'_';
  for(const k of Object.keys(RAW)){
    if(k==='roles'||k==='memory'){const o={};for(const [id,r] of Object.entries(RAW[k]))if(ownerOf(r)===a)o[id]=r;S[k]=o}
    else if(k==='news'){const o={};for(const [id,r] of Object.entries(RAW[k]))if(!r.profileId||r.profileId===a)o[id]=r;S[k]=o}
    else if(k==='agents'){const o={};for(const [id,g] of Object.entries(RAW[k])){const b={...g};if(g.byProfile){ADV.forEach(f=>delete b[f]);Object.assign(b,g.byProfile[ak]||{})}o[id]=b}S[k]=o}
    else if(k==='questions'){const o={};for(const [id,q] of Object.entries(RAW[k])){const b={...q};if(q.answers){b.answer=q.answers[ak];b.answeredAt=undefined}o[id]=b}S[k]=o}
    else S[k]=RAW[k]}}

"Raised on the Coast Mountain trails, Scout learned to follow faint scents others missed. Never trusts a lead until it is confirmed at the source.": "Criado en los senderos de las Coast Mountains, Scout aprendió a seguir rastros tenues que otros pasaban por alto. Nunca confía en una pista hasta confirmarla en la fuente.",
"Hands off to:": "Pasa a:",

"Measures each role against your background without flattery.": "Mide cada cargo contra tu trayectoria, sin adulación.",

"The Coach, with broad advice on CV and approach.": "El Coach, con consejos generales sobre CV y enfoque.",

"You, ready to apply.": "Tú, listo para postular.",

const TC={},TQ=new Set(),TF=new Set();let tqT=0,tqBusy=false,SMP;
try{Object.assign(TC,JSON.parse(localStorage.getItem('jd-tc')||'{}'))}catch(e){}
function looksEn(t){if(t.length<28||t.split(/\s+/).length<5)return false;if(/[áéíóúñ¿¡]/i.test(t))return false;return /\b(the|and|of|to|for|in|with|is|are|on|at|your|you|a|an|that|this|from|by)\b/i.test(t)}
function flushTQ(){clearTimeout(tqT);tqT=setTimeout(async()=>{
  if(tqBusy||LANG!=='es'||!TQ.size)return;
  try{if(localStorage.getItem('jd-lang')!=='es')return}catch(e){return}
  tqBusy=true;const batch=[...TQ].slice(0,30);batch.forEach(x=>TQ.delete(x));
  try{if(SMP===undefined)SMP=await claude.use('sample');
   if(!SMP){batch.forEach(x=>TF.add(x));TQ.clear();return}
   const r=await SMP.json('Translate each string to neutral Latin American Spanish. Keep names, numbers, company names, job titles and proper nouns unchanged. Return ONLY a JSON array of strings, same length and order.\n'+JSON.stringify(batch),{modelTier:'quick'});
   if(Array.isArray(r)&&r.length===batch.length){batch.forEach((x,i)=>{if(typeof r[i]==='string'&&r[i])TC[x]=r[i];else TF.add(x)});try{localStorage.setItem('jd-tc',JSON.stringify(TC))}catch(e){}}
   else batch.forEach(x=>TF.add(x))}
  catch(e){batch.forEach(x=>TF.add(x));TQ.clear()}
  finally{tqBusy=false;xlate();if(TQ.size)flushTQ()}},700)}
function T(s){if(LANG!=='es'||!s)return s;const t=s.trim();if(!t)return s;if(ES[t]!==undefined)return s.replace(t,ES[t]);for(const [r,f] of RX){const m=t.match(r);if(m)return s.replace(t,f(m))}return s}
function TA(v){if(LANG!=='es'||!v)return v;if(ES['@'+v]!==undefined)return ES['@'+v].replace(/^@/,'');for(const [r,f] of RX){const m=v.match(r);if(m)return f(m)}return ES[v]!==undefined?ES[v]:v}
function xlate(root){
  if(LANG!=='es')return;
  const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);let n;const nodes=[];
  while(n=w.nextNode()){const p=n.parentElement;if(!p||p.closest('script,style,textarea'))continue;nodes.push(n)}
  for(const x of nodes){let v=T(x.nodeValue);if(v===x.nodeValue){const t=x.nodeValue.trim();if(TC[t])v=x.nodeValue.replace(t,TC[t]);else if(looksEn(t)&&!TF.has(t))TQ.add(t)}if(v!==x.nodeValue)x.nodeValue=v}
  if(TQ.size)flushTQ();
  (root||document.body).querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>['placeholder','aria-label','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const t=TA(v);if(t!==v)e.setAttribute(a,t)}}));
}
let xraf=0;const xmo=new MutationObserver(()=>{if(LANG!=='es')return;cancelAnimationFrame(xraf);xraf=requestAnimationFrame(()=>xlate())});
function setLang(l){LANG=l;try{localStorage.setItem('jd-lang',l)}catch(e){}document.documentElement.lang=l;syncLang();render()}
function syncLang(){document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)))}
document.addEventListener('click',e=>{const b=e.target.closest('.lang button');if(b&&b.dataset.lang)setLang(b.dataset.lang)});
xmo.observe(document.body,{childList:true,subtree:true,characterData:true});
document.documentElement.lang=LANG;syncLang();
let raf=0;const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};
